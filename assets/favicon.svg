<svg width="32" height="32" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ElectronArt">
  <!-- Máscara con las esquinas fresadas a 45°, como sale una placa real, y
       encima el monograma (dos trazas de cobre a la vía, salida al pad). A
       16 px se lee la vía dorada centrada, que es lo que tiene que quedar. -->
  <path d="M9 0 H40 V31 L31 40 H0 V9 Z" fill="#0C0E12"/>
  <g fill="none" stroke="#B87333" stroke-width="3.4" stroke-linecap="square">
    <path d="M4 34 L16 22"/>
    <path d="M4 6 L16 18"/>
  </g>
  <path d="M25 20 L34 20" stroke="#C9A227" stroke-width="3.4" stroke-linecap="square" fill="none"/>
  <circle cx="20" cy="20" r="5.2" fill="#0C0E12" stroke="#C9A227" stroke-width="3.4"/>
  <circle cx="35" cy="20" r="3" fill="#C9A227"/>
</svg>
