<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ElectronArt">
  <!-- Sistema «Máscara» — el monograma son dos trazas de cobre que entran a
       45° a una vía y una que sale al pad de oro. Nada de rayos ni de orbitales
       de electrones: eso le sirve a cualquier empresa de electrónica; esto es
       de quien fabrica placas. Sin fondo, para montarlo sobre cualquier
       superficie (la máscara con las esquinas fresadas vive en favicon.svg). -->
  <g fill="none" stroke="#B87333" stroke-width="3.2" stroke-linecap="square">
    <path d="M4 34 L16 22"/>
    <path d="M4 6 L16 18"/>
  </g>
  <path d="M25 20 L34 20" stroke="#C9A227" stroke-width="3.2" stroke-linecap="square" fill="none"/>
  <circle cx="20" cy="20" r="5" fill="#0C0E12" stroke="#C9A227" stroke-width="3.2"/>
  <circle cx="35" cy="20" r="3.4" fill="#C9A227"/>
</svg>
