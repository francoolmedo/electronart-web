# Netlify config for the ElectronArt landing page.
# Connect the repo and set the *base directory* to `website` (this file then
# resolves publish = "." to that folder). No build step — it's a static site.

[build]
  base = "website"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
